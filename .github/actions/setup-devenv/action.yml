name: Setup devenv
description: Install Nix and devenv, restore the Nix and pnpm caches, and build the devenv shell.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          keep-env-derivations = true
          keep-outputs = true
    - name: Cache devenv Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 3G
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-

    - name: Build the devenv shell and run any pre-commit hooks
      shell: bash
      run: devenv test
