version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
