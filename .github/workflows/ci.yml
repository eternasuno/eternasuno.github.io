name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv

      - name: check && build
        shell: devenv shell bash -- -e {0}
        run: |
          pnpm run check
          pnpm run typecheck
          pnpm run build
